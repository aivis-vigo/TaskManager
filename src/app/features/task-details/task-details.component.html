<button (click)="toggleEditMode()">
  <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none"
       stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 20h9"/>
    <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
  </svg>
</button>

@if (errorMessage) {
  <div>{{ errorMessage }}</div>
}

@if (editMode) {
  <form [formGroup]="currentTask" (ngSubmit)="onUpdate()">

    <div class="form-layout">
      <div>
        <label for="title">Title:</label>
        <input id="title" type="text" formControlName="title" required>
        <app-input-validator [property]="title" [minLength]="5"></app-input-validator>
      </div>

      <div>
        <label for="description">Description:</label>
        <input id="description" type="text" formControlName="description" required>
        <app-input-validator [property]="description" [minLength]="10"></app-input-validator>
      </div>

      <div>
        <label for="type">Type:</label>
        <input id="type" type="text" formControlName="type" required>
        <app-input-validator [property]="type"></app-input-validator>
      </div>

      <div>
        <label for="status">Status:</label>
        <input id="status" type="text" formControlName="status" required>
      </div>
      <app-input-validator [property]="status"></app-input-validator>
    </div>

    <button [ngClass]="{'enabled-button': currentTask.valid, 'disabled-button':!currentTask.valid}"
            [disabled]="!currentTask.valid" type="submit">Update
    </button>

  </form>
} @else {
  @if (task) {
    <div class="task-card">
      <p>{{ task.title }}</p>
      <p>{{ task.description }}</p>
      <p>{{ task.type }}</p>
      <p>{{ task.createdOn }}</p>
      <p>{{ task.status }}</p>
    </div>
  }
}
