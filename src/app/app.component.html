<nav>
  <!-- left side -->
  <div>
    <ul>
      @if (userService.currentUserSig()) {
        <li>
          <a routerLink="task-list" routerLinkActive="active" ariaCurrentWhenActive="page"
             [translate]="'navigationBar.task-list'"></a>
        </li>
        @if (userService.isAuthorized('Admin')) {
          <li>
            <a routerLink="create-task" routerLinkActive="active" ariaCurrentWhenActive="page"
               [translate]="'navigationBar.create-task'"></a>
          </li>
          <li>
            <a routerLink="user-list" routerLinkActive="active" ariaCurrentWhenActive="page"
               [translate]="'navigationBar.user-list'"></a>
          </li>
        }
      }
    </ul>
  </div>
  <!-- right side -->
  <div>
    <!-- change language -->
    <select (change)="languageService.changeLanguage($event.target)">
      <option value="lv">LV</option>
      <option value="en">EN</option>
    </select>

    <!-- login/register -->
    @if (!userService.currentUserSig()) {
      <div>
        <a routerLink="login" routerLinkActive="active" ariaCurrentWhenActive="page"
           [translate]="'navigationBar.login'"></a>
        <a routerLink="register" routerLinkActive="active" ariaCurrentWhenActive="page"
           [translate]="'navigationBar.register'"></a>
      </div>
    }

    <!-- authorized users name -->
    @if (userService.currentUserSig()) {
      <div>
        <p>{{ userService.getFullName() }}</p>
        <a
          routerLink="login"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          (click)="userService.logout()"
          [translate]="'button.logout'">
        </a>
      </div>
    }
  </div>
</nav>

<router-outlet></router-outlet>
