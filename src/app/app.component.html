<nav>
  <ul>
    <li>
      <a routerLink="create-task" routerLinkActive="active" ariaCurrentWhenActive="page">Create</a>
    </li>
    <li>
      <a routerLink="task-list" routerLinkActive="active" ariaCurrentWhenActive="page">Task List</a>
    </li>
    @if (userService.isAuthorized()) {
      <li>
        <a routerLink="user-list" routerLinkActive="active" ariaCurrentWhenActive="page">User List</a>
      </li>
    }
  </ul>

  @if (!userService.currentUserSig()) {
    <a routerLink="login" routerLinkActive="active" ariaCurrentWhenActive="page">Login</a>
    <a routerLink="register" routerLinkActive="active" ariaCurrentWhenActive="page">Register</a>
  }

  @if (userService.currentUserSig()) {
    <p>{{ userService.getFullName() }}</p>
    <a routerLink="login" routerLinkActive="active" ariaCurrentWhenActive="page"
       (click)="userService.logout()">Logout</a>
  }

</nav>

<router-outlet></router-outlet>
