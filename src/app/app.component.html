<nav>
  <ul>
    <li>
      <a routerLink="create-task" routerLinkActive="active" ariaCurrentWhenActive="page">Create</a>
    </li>
    <li>
      <a routerLink="task-list" routerLinkActive="active" ariaCurrentWhenActive="page">List</a>
    </li>
  </ul>

  @if (!userService.getAuthToken()) {
    <a routerLink="login" routerLinkActive="active" ariaCurrentWhenActive="page">Login</a>
    <a routerLink="#" routerLinkActive="active" ariaCurrentWhenActive="page">Register</a>
  }

  @if (userService.getAuthToken()) {
    <p>{{userService.getFullName()}}</p>
    <a routerLink="login" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="userService.logout()">Logout</a>
  }

</nav>
